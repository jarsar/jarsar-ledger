<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- height=device-height matters on an installed iPhone app: without it iOS
         hands the page screen-height minus the status bar while still drawing
         it under the status bar, stranding a band at the bottom that the page
         never owns and that iOS fills with the manifest background colour. -->
    <meta
      name="viewport"
      content="width=device-width, height=device-height, initial-scale=1, viewport-fit=cover"
    />

    <title>JarSar Ledger</title>
    <meta name="description" content="The expense book of JarSar Capital." />

    <meta name="theme-color" content="#1D3B42" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ledger" />

    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="icon" href="icons/icon-192.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
